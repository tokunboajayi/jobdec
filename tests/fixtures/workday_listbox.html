<!doctype html>
<html><head><meta charset="utf-8"><title>Workday listbox</title></head>
<body>
<label id="cl" for="country">Country / Territory*</label>
<button id="country" aria-haspopup="listbox" aria-labelledby="cl">Select One</button>
<ul id="list" role="listbox" hidden></ul>
<script>
  // 250 countries like Workday; "United States of America" sits past position 100
  const names = ["Afghanistan", "Aland Islands", "Albania"];
  for (let i = 0; i < 240; i++) names.push("Country " + String(i).padStart(3, "0"));
  names.push("Georgia", "United Kingdom", "United States of America", "Uruguay", "Zambia");
  const btn = document.getElementById("country"), list = document.getElementById("list");
  for (const n of names) {
    const li = document.createElement("li"); li.setAttribute("role", "option"); li.textContent = n;
    li.addEventListener("click", () => { btn.textContent = n; btn.dataset.chosen = n; list.hidden = true; });
    list.appendChild(li);
  }
  btn.addEventListener("click", () => { list.hidden = false; });
</script>
</body></html>
