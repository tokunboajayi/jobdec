<!doctype html>
<html><head><meta charset="utf-8"><title>Sample application</title></head>
<body>
<h1>Apply: AI Automation Intern</h1>
<form>
  <label for="fn">First Name *</label><input id="fn" name="first_name" required>
  <label for="ln">Last Name *</label><input id="ln" name="last_name" required>
  <label for="em">Email *</label><input id="em" name="email" type="email" required>
  <label for="ph">Phone *</label><input id="ph" name="phone" type="tel" required>
  <label for="sp">Will you now or in the future require visa sponsorship? *</label>
  <select id="sp" name="sponsorship" required><option value="">Select</option><option>Yes</option><option>No</option></select>
  <button type="button">Next</button>
</form>
</body></html>
